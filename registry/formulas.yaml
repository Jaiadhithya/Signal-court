# Formula registry. Evaluated by an AST walker; no eval.
- {id: nii, text: "interest earned minus interest expended", expr: "interest_earned - interest_expended", unit: inr_cr, v: 1}
- {id: ppop, text: "net interest income plus other income minus operating expenses", expr: "nii + other_income - opex", unit: inr_cr, v: 1}
- {id: yoy, text: "change versus the same quarter a year earlier", expr: "x / lag(x, 4) - 1", unit: fraction, v: 1}
- {id: qoq, text: "change versus the previous quarter", expr: "x / lag(x, 1) - 1", unit: fraction, v: 1}
- {id: cagr_2y, text: "two-year compound growth", expr: "(x / lag(x, 8)) ** 0.5 - 1", unit: fraction, v: 1}
- {id: ldr, text: "advances divided by deposits", expr: "advances / deposits", unit: fraction, v: 1}
- {id: credit_cost, text: "annualised provisions over average advances", expr: "4 * provisions / mean(advances, lag(advances, 1))", unit: fraction, v: 1}
- {id: pat_minus_ppop_growth, text: "PAT growth minus PPOP growth (provision-driven profit)", expr: "yoy(pat) - yoy(ppop)", unit: pp, v: 1}
- {id: gnpa_change_vs_writeoffs, text: "share of GNPA decline explained by write-offs", expr: "write_offs / -(gnpa_amt - lag(gnpa_amt, 1) - gross_slippages)", unit: fraction, v: 1}
- {id: stage23_growth_vs_ratio, text: "Stage 2+3 amount growth vs Stage 2+3 ratio change", expr: "yoy(stage23_amt) - yoy(stage2_pct + stage3_pct)", unit: pp, v: 1}
- {id: share, text: "component share of total", expr: "part / total", unit: fraction, v: 1}
- {id: robust_z, text: "(x - peer median) / (1.4826 * peer MAD)", expr: "builtin", unit: z, v: 1}
- {id: adjusted_for_component, text: "reported value minus a component the company itself disclosed separately", expr: "x - component", unit: same, v: 1}
- {id: specificity, text: "1 minus peer-median change over company change, clipped to 0..1", expr: "builtin", unit: fraction, v: 1}
- {id: kill_threshold, text: "the target's latest reported value minus half the signal's gap size", expr: "builtin", unit: same, v: 1}
- {id: sector_shock, text: "peer median change across the break as a fraction of the target's change (scale-free units)", expr: "builtin", unit: fraction, v: 1}
- {id: corporate_action, text: "1 if a scheme filing or share-count move lies within the sensor's window of the break", expr: "builtin", unit: flag, v: 1}
- {id: base_effect, text: "robust z of the last pre-break quarter against the quarters before it", expr: "builtin", unit: z, v: 1}
- {id: one_off, text: "quarters the gap held after the break", expr: "builtin", unit: quarters, v: 1}
# Concrete per-entity formulas the calculator can evaluate directly.
- {id: ppop_calc, text: net interest income plus other income minus operating expenses, expr: nii + other_income - opex, unit: inr_cr, v: 1}
- {id: yoy_pat, text: PAT change versus the same quarter a year earlier, expr: yoy(pat), unit: fraction, v: 1}
- {id: yoy_advances, text: advances change versus the same quarter a year earlier, expr: yoy(advances), unit: fraction, v: 1}
- {id: yoy_deposits, text: deposits change versus the same quarter a year earlier, expr: yoy(deposits), unit: fraction, v: 1}
- {id: yoy_ppop, text: PPOP change versus the same quarter a year earlier, expr: yoy(ppop), unit: fraction, v: 1}
- {id: qoq_gnpa_pct, text: gross NPA ratio change versus the previous quarter, expr: "gnpa_pct - lag(gnpa_pct, 1)", unit: fraction, v: 1}
- {id: cagr_2y_advances, text: two-year compound growth of advances, expr: "(advances / lag(advances, 8)) ** 0.5 - 1", unit: fraction, v: 1}
- {id: nim_proxy, text: annualised net interest income over average total assets, expr: "4 * nii / mean(total_assets, lag(total_assets, 1))", unit: fraction, v: 1}
- {id: cost_to_income, text: operating expenses over net interest income plus other income, expr: opex / (nii + other_income), unit: fraction, v: 1}
