subtypes: [bank, nbfc, insurer_life, insurer_general, holding, generic]
# Filing-format -> sub-type rules. Tokens are matched case-insensitively
# against the XBRL entry-point file name, the ResultType fact and the XBRL file URL.
# Confirmed on 11 Oct from real NSE files: the integrated entry point (in-capmkt-ent-*.xsd) is the same for every
# sub-type, and the legacy NBFC/insurer entry points are generic too, so the signal is the XBRL file name
# (INTEGRATED_FILING_BANKING_/NBFC_INDAS_/LI_..., legacy BANKING_/NBFC_INDAS_/LI_...) and, for legacy
# insurer listings, insuranceType "Life-Insurance". General-insurer tokens are still a guess (verify).
format_rules:
  - {subtype: bank,           tokens: ["banking"],                         status: verified}
  - {subtype: insurer_life,   tokens: ["life_insurance", "lifeinsurance", "life insurance", "life-insurance", "insurance_life", "filing_li_", "/li_"], status: verified}
  - {subtype: insurer_general, tokens: ["general_insurance", "generalinsurance", "general insurance", "general-insurance", "insurance_general", "filing_gi_", "/gi_"], status: verify}
  - {subtype: insurer,        tokens: ["insurance"],                       status: verify}   # life vs general decided by sub-token, else life/general by L-forms vs NL-forms
  - {subtype: nbfc,           tokens: ["nbfc"],                            status: verified}
  - {subtype: generic,        tokens: ["ind-as", "indas", "other_than_bank", "other than bank"], status: verified}
# Holding company test: consolidated segment labels classified by these generic lexicons, or a CIC registration phrase.
segment_lexicon:
  lending: ["lending", "loans", "financing", "nbfc", "housing finance", "consumer finance", "finance", "credit"]
  insurance: ["insurance", "life insurance", "general insurance", "reinsurance", "health insurance"]
cic_phrases: ["core investment company", "core investment companies"]
# Announcement descriptions that mark an insurer (public disclosure forms).
insurer_form_markers: ["l-form", "nl-form", "public disclosures", "irdai"]
