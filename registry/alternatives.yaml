# Red-team checklist. Each alternative has a code test in court/alttests.py,
# run before any LLM call, and the record kinds that count as an admissible rebuttal.
- id: sector_shock
  code_test: "twin gap where the twin applies, else peer median move over the break window; regulatory events dated in the window"
  rebuttal: "CALC showing peers or the twin did not move (specificity >= 0.5) or placebo p <= 0.10"
  rebuttal_kinds: [CALC]
- id: accounting_or_definition_change
  code_test: "KPI-diff hits and redefinition terms within +-1 quarter; search of notes for 'change in accounting policy'"
  rebuttal: "SPAN showing no policy change in the period, or CALC recomputed on a consistent basis"
  rebuttal_kinds: [SPAN, CALC]
- id: one_off
  code_test: "persistence: quarters the gap held after the break"
  rebuttal: "CALC with persistence >= 3 quarters"
  rebuttal_kinds: [CALC]
- id: base_effect
  code_test: "recompute with 2-year CAGR and with level change"
  rebuttal: "CALC on an alternative base keeping the sign"
  rebuttal_kinds: [CALC]
- id: merger_or_acquisition
  code_test: "corporate-action events within +-1 quarter"
  rebuttal: "pre/post-split CALC, or the signal re-run excluding merged periods"
  rebuttal_kinds: [CALC]
- id: seasonality
  code_test: "same-quarter YoY and the same quarter in prior years"
  rebuttal: "seasonally matched CALC keeping the sign"
  rebuttal_kinds: [CALC]
- id: regulatory_change
  code_test: "RBI/IRDAI/SEBI events in the window from get_regulator_events"
  rebuttal: "REGEVENT dated outside the window, or peers not moving at the rule date"
  rebuttal_kinds: [REGEVENT, CALC]
- id: data_error
  code_test: "reconciliation status of every input (XBRL vs deck, sums)"
  rebuttal: "reconciliation pass against a second source"
  rebuttal_kinds: [CALC]
- id: disclosed_elsewhere          # A5
  code_test: "PROBE searches of the company's own filings for the edge"
  rebuttal: "PROBEs returning no matching self-disclosure"
  rebuttal_kinds: [PROBE]
- id: guidance_already_revised     # A10
  code_test: "later GUIDANCE records for the same metric that revise the target before its deadline"
  rebuttal: "SPAN showing the target was not revised, or a CALC of the miss against the revised target"
  rebuttal_kinds: [SPAN, CALC]
- id: external_series_artefact     # R2-R4
  code_test: "dataset definition or coverage change in the period; entity mapping changed (merger, rename)"
  rebuttal: "SPAN from the publisher showing a stable definition, or the signal recomputed excluding the changed months"
  rebuttal_kinds: [SPAN, CALC]
