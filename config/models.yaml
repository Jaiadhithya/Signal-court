# Providers, deployments and role chains. `<verify>` ids are filled from the day-1 models smoke report.
providers:
  mistral:    {base_url: "https://api.mistral.ai/v1",                               keys_env: MISTRAL_API_KEYS}
  nim:        {base_url: "https://integrate.api.nvidia.com/v1",                     keys_env: NVIDIA_API_KEYS}
  groq:       {base_url: "https://api.groq.com/openai/v1",                          keys_env: GROQ_API_KEYS}
  gemini:     {base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", keys_env: GEMINI_API_KEYS}
  openrouter: {base_url: "https://openrouter.ai/api/v1",                            keys_env: OPENROUTER_API_KEYS}
  zai:        {base_url: "https://api.z.ai/api/paas/v4",                            keys_env: ZAI_API_KEYS}
  github:     {base_url: "https://models.github.ai/inference",                      keys_env: GITHUB_MODELS_TOKENS}

deployments:   # name: [provider, model id, family, ctx, rpm, tpm, rpd]   (limits from day-1 console readings)
  mistral-medium:   [mistral, mistral-medium-latest, mistral, 256000, 60, 500000, null]
  mistral-large:    [mistral, mistral-large-latest, mistral, 256000, 60, 500000, null]
  mistral-small:    [mistral, mistral-small-latest, mistral, 128000, 60, 500000, null]
  nemotron-ultra:   [nim, "<verify: nemotron-3-ultra id>", nvidia, 1000000, 40, null, null]
  deepseek-flash:   [nim, "<verify: deepseek-v4.1-flash id>", deepseek, 128000, 40, null, null]
  glm-52-nim:       [nim, "<verify: z-ai/glm-5.2>", zhipu, 128000, 40, null, null]
  gpt-oss-120b:     [groq, openai/gpt-oss-120b, openai, 131000, 30, 8000, 1000]
  gpt-oss-20b:      [groq, openai/gpt-oss-20b, openai, 131000, 30, 8000, 1000]
  qwen-27b:         [groq, "<verify: qwen/qwen3.8-27b>", qwen, 131000, 30, 8000, 1000]
  gemma-31b:        [gemini, "<verify: gemma-4-31b-it>", google, 33000, 15, null, 1000]
  gemini-flash:     [gemini, "<verify: gemini-3.8-flash>", google, 1000000, 10, null, 20]
  gemini-flash-lite: [gemini, "<verify: gemini-3.5-flash-lite>", google, 1000000, 15, null, null]
  glm-flash:        [zai, glm-4.7-flash, zhipu, 200000, 5, null, null]
  nemotron-or:      [openrouter, "<verify: nvidia/nemotron-3-ultra-550b-a55b:free>", nvidia, 1000000, 20, null, 50]

roles:         # ordered chains; `demo` overrides apply in live/warm demo runs
  extract:          [mistral-medium, gemini-flash-lite, glm-flash, nemotron-or]           # no NIM for bulk work (M2)
  extract_wholedoc: [nemotron-ultra, gemini-flash, gemini-flash-lite]                     # rare, >256K
  draft:            [nemotron-ultra, deepseek-flash, mistral-medium, gemini-flash]
  investigate:      [mistral-medium, mistral-large, gemini-flash-lite, glm-flash]
  advocate:         [mistral-medium, mistral-large, glm-52-nim, gemini-flash-lite]
  redteam:          [gpt-oss-120b, qwen-27b, gpt-oss-20b, glm-flash]                       # sweeps and pre-runs
  redteam.demo:     [deepseek-flash, gpt-oss-120b, qwen-27b, glm-flash]                    # M1: NIM first in demo
  entail:           [gemma-31b, gpt-oss-20b, mistral-small, glm-flash]                     # family guard picks
  write:            [mistral-medium, gemini-flash-lite, nemotron-or]
  coverage:         [mistral-small, gemma-31b]
