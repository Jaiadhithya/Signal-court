# Defaults. Tuned on the development set, frozen 24 Oct, printed in every RUN record.
[panel]
quarters = 20                 # five years
min_quarters_to_run = 8
tier2_peers = 3               # nearest same-sub-type peers that also get deck extraction
max_peers = 40                # peer universe per sub-type: the largest by latest total income
basis_default = "standalone"  # holding companies override to consolidated + segments

[sensors]
robust_z_threshold = 2.0
persistence_min_quarters = 2
pelt_min_size = 3
pelt_penalty_rule = "bic"     # pen = log(n) * var(first differences); never tuned per company
open_screen_min_corr = 0.6
corp_action_window_q = 1
corp_action_factor = 0.25     # surprise multiplier when a break coincides with a scheme/merger
corp_action_titles = ["amalgamation", "merger", "arrangement"]   # exchange categories of a scheme filing that combine businesses
corp_action_cluster_gap_days = 120   # scheme filings closer than this belong to one corporate action
donor_min_coverage = 0.75     # a donor must report this share of the target's pre-period quarters
donor_min_quarters = 3        # and at least this many of them
share_step_factors = [1.5, 2, 3, 4, 5, 10]   # share-count steps read as a bonus issue or split
share_step_tolerance = 0.05   # relative distance from a factor that still counts as that step
share_flat_tolerance = 0.1    # other quarter-on-quarter share moves above this make the share count unreadable

[placebo]                     # enlarged placebo set for every sensor statistic
in_space = "all_same_subtype" # every entity of the same sub-type that has the metric
in_time_shifts = [-4, -3, -2, 2]   # quarters relative to the break; skipped where out of range
min_for_strong = 40           # fewer placebos -> Strong unreachable, card says why
holm_alpha = 0.10

[twin]                        # wave 1 (adhi, 10 Oct)
enabled = true                # per sub-type/metric "not applicable" when the quality gate fails (section 1.1)
min_donors = 15
pre_period_min_q = 8
max_pre_rmspe_sd = 0.5
loo = true

[mirror]                      # wave 2, R1
enabled = true
min_lenders_with_edges = 4

[external]                    # wave 2, R2-R4
enabled_groups = ["asset_quality", "funding", "nowcast"]
min_points_q = 8
min_peers = 5
lead_lags_q = [1, 2]          # lead-lag test against the company's own reported series
normalise_by = "advances"     # per INR 1,000 cr for count series (lenders); "premium" for insurers

[sayado]                      # wave 2, R5
enabled = true
min_scored = 6
silent_deletion_min_mentions = 3   # mentioned in >= 3 consecutive calls, then absent for >= 2
met_tolerance = "display_rounding"

[forensics]                   # wave 2, R6
enabled = true
similarity = "tfidf_cosine"
min_section_words = 150
peer_z_threshold = 2.0

[rbi_divergence]              # wave 2, R7
enabled = false               # code refuses to enable unless registry/rbi_divergence.yaml has verified: true with a span rid

[snapshot]                    # cut on merit as a signal; optional job only
enabled = false

[rank]
k = 5
k_max = 8
coverage_unknown = 0.5        # neutral, never rewarded
surprise_floor = 0.05

[budgets]
reasoning_calls = 60
reasoning_calls_cap = 90
extraction_calls = 40           # uncached calls in one run; nightly pre-warm extracts decks, transcripts and edges for the 12 + peers
extraction_calls_cap = 60
tool_calls = 120
tool_calls_cap = 200
calls_per_claim_floor = 8     # fairness floor
calls_per_claim_cap = 20
harvest_time_cap_s = 240
court_time_cap_s = 210        # demo mode
concurrency = 3
tavily_queries_per_run = 20   # review T3; ddgs takes the overflow; every result cached

[packs]
max_tokens_default = 12000
max_tokens_redteam = 3000     # review M1
max_tokens_entail_batch = 4000

[quote_gate]
min_words = 4
max_words = 60
table_window_chars = 300
fuzzy_for_ocr_only = 0.97

[judge]
strong_families = 3
moderate_families = 2
strong_challenges_answered = 2
stat_holm_max = 0.10          # Holm-adjusted placebo p across all sealed CLAIMs
moderate_p_raw_max = 0.10
specificity_kill = 0.3
specificity_rebut = 0.5
lead_series_min_points = 8

[writer]
discovery_max_words = 35
why_bullets = [3, 5]
timeline_min_events = 3

[pipeline]                    # stub or real per stage; each sprint flips its stage to "real"
harvest = "real"
measure = "real"
sense = "real"
prereg = "stub"
court = "stub"
judge = "real"
report = "stub"

[demo]                        # live finals run: per-stage time caps (s); whole run must fit the 10-minute slot
harvest_cap_s = 45
measure_cap_s = 30
sense_cap_s = 30
prereg_cap_s = 20
court_cap_s = 210
report_cap_s = 15
peer_median_min_donors = 4    # below this the sensor falls back to the company's own history
